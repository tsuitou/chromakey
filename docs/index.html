<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Green → Alpha（任意色キー・半透明影・適応デスピル）</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#222; --muted:#666; --line:#e3e5e8; --accent:#111;
    --radius:10px; --gap:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;color:var(--text);background:var(--bg)}
  header{position:sticky;top:0;z-index:5;padding:14px 18px;background:var(--accent);color:#fff}
  header .title{font-weight:700}
  /* レイアウト：上段=プレビュー、下段=操作パネル（1カラム） */
  main{padding:16px;display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  /* プレビュー */
  .view{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:900px){.view{grid-template-columns:1fr}}
  .pane{
    background:repeating-conic-gradient(#bbb 0% 25%, #eee 0% 50%) 50%/24px 24px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden
  }
  .pane header{position:static;background:#f4f5f7;color:var(--text);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
  canvas{display:block;width:100%;height:auto}

  /* 操作パネル：行分割（ラベル／コントロール） */
  fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 var(--gap)}
  legend{padding:0 6px;font-weight:600}
  .formRow{display:grid;grid-template-columns:minmax(140px, 260px) 1fr;gap:12px;align-items:center;margin:10px 0}
  .control{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type="range"]{width:100%}
  input[type="number"], input[type="text"]{padding:6px 8px;border:1px solid #cfd3d8;border-radius:6px}
  input[type="number"]{width:96px}
  input[type="text"]{width:110px}
  input[type="color"]{inline-size:44px;block-size:28px;padding:0;border:1px solid #cfd3d8;border-radius:6px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  button, label.btn{appearance:none;border:1px solid #cfd3d8;background:#fff;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted)}
  .drop{border:2px dashed #c5c9cf;border-radius:10px;background:#fbfcfe;color:var(--muted);padding:16px;text-align:center}
  .drop.drag{border-color:#4a90e2;color:#4a90e2;background:#f0f7ff}
  .swatch{width:18px;height:18px;border:1px solid #cfd3d8;border-radius:4px;display:inline-block}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  details{border:1px dashed #dcdfe3;border-radius:8px;padding:8px 10px}
  summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header><span class="title">Green → Alpha</span>（任意色キー・半透明影・適応デスピル／ローカル処理）</header>

<main>
  <!-- 上段：プレビュー -->
  <section class="card">
    <div class="view">
      <div class="pane">
        <header>処理前</header>
        <canvas id="canvasSrc" aria-label="処理前"></canvas>
      </div>
      <div class="pane">
        <header>処理後</header>
        <canvas id="canvasOut" aria-label="処理後（アルファ表示）"></canvas>
      </div>
    </div>
  </section>

  <!-- 下段：操作パネル -->
  <section class="card">
    <fieldset>
      <legend>画像の読み込み</legend>
      <div class="formRow">
        <label>入力</label>
        <div class="control">
          <div class="drop" id="drop" style="flex:1">
            ここに画像をドラッグ＆ドロップ
            <div class="btns" style="margin-top:8px">
              <label class="btn">ファイルを選択 <input id="file" type="file" accept="image/*" hidden></label>
              <button id="demo" type="button">デモ画像</button>
            </div>
            <div class="hint">処理はブラウザ内で完結します。</div>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>キー色（背景色）</legend>
      <div class="formRow">
        <label>色選択</label>
        <div class="control">
          <input id="keyColor" type="color" value="#00ff00">
          <input id="keyHex" type="text" class="mono" value="#00ff00">
          <span>現在色 <span id="keySw" class="swatch" style="background:#00ff00"></span></span>
        </div>
      </div>
      <div class="formRow">
        <label>取得方法</label>
        <div class="control">
          <button id="pipette" type="button">スポイト（OS）</button>
          <span class="hint">または上の「処理前」画像をクリックで取得</span>
        </div>
      </div>
      <div class="formRow">
        <label>プリセット</label>
        <div class="control btns">
          <button type="button" data-preset="#00ff00">Green</button>
          <button type="button" data-preset="#0000ff">Blue</button>
          <button type="button" data-preset="#ff00ff">Magenta</button>
          <button type="button" data-preset="#ff0000">Red</button>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>前景／背景の分離（色差マット）</legend>
      <div class="formRow">
        <label>色差しきい（開始）</label>
        <div class="control">
          <input id="thrLow" type="range" min="0" max="100" value="20"><span class="mono" id="thrLowV">20</span>
        </div>
      </div>
      <div class="formRow">
        <label>色差しきい（完全分離）</label>
        <div class="control">
          <input id="thrHigh" type="range" min="0" max="160" value="50"><span class="mono" id="thrHighV">50</span>
        </div>
      </div>
      <div class="formRow">
        <label>エッジの視覚ソフト</label>
        <div class="control">
          <input id="edgeSoft" type="range" min="0" max="2" step="0.1" value="0.0"><span class="mono" id="edgeSoftV">0.0</span>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>影（半透明）生成</legend>
      <div class="formRow">
        <label>影の感度</label>
        <div class="control">
          <input id="shadowSens" type="range" min="0" max="400" value="160"><span class="mono" id="shadowSensV">160</span>
        </div>
      </div>
      <div class="formRow">
        <label>影の最大不透明度</label>
        <div class="control">
          <input id="shadowMax" type="range" min="0" max="100" value="60"><span class="mono" id="shadowMaxV">0.60</span>
        </div>
      </div>
      <div class="formRow">
        <label>影アルファのガンマ</label>
        <div class="control">
          <input id="shadowGamma" type="range" min="10" max="300" value="120"><span class="mono" id="shadowGammaV">1.20</span>
        </div>
      </div>
      <div class="formRow">
        <label>影はグレースケール</label>
        <div class="control">
          <input id="shadowGray" type="checkbox" checked><span class="hint">背景側（影/残留背景）を常にグレー出力</span>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>デスピル（キー色適応）</legend>
      <div class="formRow">
        <label>強さ</label>
        <div class="control">
          <input id="despill" type="range" min="0" max="100" value="35"><span class="mono" id="despillV">0.35</span>
        </div>
      </div>
      <div class="formRow">
        <label>適用角度（±deg）</label>
        <div class="control">
          <input id="angleDeg" type="range" min="5" max="45" value="20"><span class="mono" id="angleDegV">20°</span>
        </div>
      </div>
      <div class="formRow">
        <label>キー近傍距離（色差）</label>
        <div class="control">
          <input id="distMax" type="range" min="20" max="120" value="60"><span class="mono" id="distMaxV">60</span>
        </div>
      </div>
      <div class="formRow">
        <label>前景度の適用域</label>
        <div class="control">
          <input id="fgLow" type="range" min="0" max="90" value="15"><span class="mono" id="fgLowV">0.15</span>
          <input id="fgHigh" type="range" min="10" max="100" value="95"><span class="mono" id="fgHighV">0.95</span>
        </div>
      </div>
      <div class="formRow">
        <label>エッジ重視（縁マスク）</label>
        <div class="control">
          <input id="edgeBias" type="range" min="0" max="100" value="40"><span class="mono" id="edgeBiasV">0.40</span>
          <span class="hint">縁でデスピルを強める</span>
        </div>
      </div>
      <div class="formRow">
        <label>輝度保持</label>
        <div class="control">
          <input id="preserveLuma" type="checkbox" checked><span class="hint">G低減後にY（明度）を補正</span>
        </div>
      </div>
    </fieldset>

    <details>
      <summary>出力とプレビュー</summary>
      <div class="formRow">
        <label>背景プレビュー色</label>
        <div class="control">
          <input id="bgPreview" type="color" value="#00000000"><span class="hint">透過確認用</span>
        </div>
      </div>
      <div class="formRow">
        <label>縮小（%）</label>
        <div class="control">
          <input id="scale" type="number" min="1" max="100" step="1" value="100">
        </div>
      </div>
    </details>

    <div class="formRow">
      <label>書き出し</label>
      <div class="control btns">
        <button id="export" class="primary" disabled>PNGを書き出し</button>
        <button id="exportMatte" type="button">マット（A）を書き出し</button>
      </div>
    </div>
    <div class="hint">出力はアルファ付きPNG（前景=不透明、影=半透明）。</div>
  </section>
</main>

<script>
(function(){
  // ===== DOM参照
  const fileInput = document.getElementById('file');
  const drop = document.getElementById('drop');
  const canvasSrc = document.getElementById('canvasSrc');
  const canvasOut = document.getElementById('canvasOut');
  const ctxSrc = canvasSrc.getContext('2d', { willReadFrequently:true });
  const ctxOut = canvasOut.getContext('2d', { willReadFrequently:true });

  const keyPicker = document.getElementById('keyColor');
  const keyHex = document.getElementById('keyHex');
  const keySw = document.getElementById('keySw');
  const pipetteBtn = document.getElementById('pipette');
  const presetButtons = Array.from(document.querySelectorAll('button[data-preset]'));

  const thrLow = document.getElementById('thrLow');
  const thrHigh = document.getElementById('thrHigh');
  const thrLowV = document.getElementById('thrLowV');
  const thrHighV = document.getElementById('thrHighV');
  const edgeSoft = document.getElementById('edgeSoft');
  const edgeSoftV = document.getElementById('edgeSoftV');

  const shadowSens = document.getElementById('shadowSens');
  const shadowMax = document.getElementById('shadowMax');
  const shadowGamma = document.getElementById('shadowGamma');
  const shadowSensV = document.getElementById('shadowSensV');
  const shadowMaxV = document.getElementById('shadowMaxV');
  const shadowGammaV = document.getElementById('shadowGammaV');
  const shadowGray = document.getElementById('shadowGray');

  const despill = document.getElementById('despill');
  const angleDeg = document.getElementById('angleDeg');
  const distMax = document.getElementById('distMax');
  const fgLow = document.getElementById('fgLow');
  const fgHigh = document.getElementById('fgHigh');
  const edgeBias = document.getElementById('edgeBias');
  const preserveLuma = document.getElementById('preserveLuma');
  const despillV = document.getElementById('despillV');
  const angleDegV = document.getElementById('angleDegV');
  const distMaxV = document.getElementById('distMaxV');
  const fgLowV = document.getElementById('fgLowV');
  const fgHighV = document.getElementById('fgHighV');
  const edgeBiasV = document.getElementById('edgeBiasV');

  const exportBtn = document.getElementById('export');
  const exportMatteBtn = document.getElementById('exportMatte');
  const bgPreview = document.getElementById('bgPreview');
  const scale = document.getElementById('scale');
  const demoBtn = document.getElementById('demo');

  // ===== State
  let imgBitmap = null, imgW = 0, imgH = 0;
  let srcBuffer = null;
  let matteCache = null;
  let reqId = 0;
  let bgLumaRef = 0.75;

  // ===== Utils
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const lerp = (a,b,t)=> a+(b-a)*t;
  function hexToRgb(hex){
    const h = (hex||'#00ff00').replace('#','');
    const v = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
    return [(v>>16)&255,(v>>8)&255,v&255];
  }
  function rgbToHex([r,g,b]){ return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  function rgbToYCbCr(r,g,b){
    const Y = 0.299*r + 0.587*g + 0.114*b;
    const Cb = -0.168736*r - 0.331264*g + 0.5*b;
    const Cr = 0.5*r - 0.418688*g - 0.081312*b;
    return [Y, Cb, Cr];
  }
  function ycbcrToRgb(Y,Cb,Cr){
    const r = Y + 1.402*Cr;
    const g = Y - 0.344136*Cb - 0.714136*Cr;
    const b = Y + 1.772*Cb;
    return [r,g,b];
  }
  function smoothstep(e0,e1,x){
    const t = clamp01((x - e0) / (e1 - e0 + 1e-6));
    return t*t*(3-2*t);
  }
  function updateLabels(){
    thrLowV.textContent = thrLow.value;
    thrHighV.textContent = thrHigh.value;
    edgeSoftV.textContent = (+edgeSoft.value).toFixed(1);
    shadowSensV.textContent = shadowSens.value;
    shadowMaxV.textContent = (shadowMax.value/100).toFixed(2);
    shadowGammaV.textContent = (shadowGamma.value/100).toFixed(2);
    despillV.textContent = (despill.value/100).toFixed(2);
    angleDegV.textContent = angleDeg.value + '°';
    distMaxV.textContent = distMax.value;
    fgLowV.textContent = (fgLow.value/100).toFixed(2);
    fgHighV.textContent = (fgHigh.value/100).toFixed(2);
    edgeBiasV.textContent = (edgeBias.value/100).toFixed(2);
    keyHex.value = keyPicker.value;
    keySw.style.background = keyPicker.value;
  }

  // ===== Core: 再計算（rAFで集約）
  function scheduleRender(){ cancelAnimationFrame(reqId); reqId = requestAnimationFrame(render); }

  function render(){
    if (!imgBitmap || !srcBuffer) return;
    const W = imgW, H = imgH;
    canvasOut.width = W; canvasOut.height = H;

    const out = ctxOut.createImageData(W,H);
    const data = srcBuffer.data;

    // キー色定義
    const [kr,kg,kb] = hexToRgb(keyPicker.value).map(v=>v/255);
    const [Yk,Cbk,Crk] = rgbToYCbCr(kr,kg,kb);

    // 背景輝度を推定（キー近傍）
    let Ysum=0, cnt=0;
    const probe = Math.max(8, +thrLow.value*0.7);
    for (let i=0;i<data.length;i+=4){
      const r=data[i]/255,g=data[i+1]/255,b=data[i+2]/255;
      const [Y,Cb,Cr]=rgbToYCbCr(r,g,b);
      const d=Math.hypot(Cb-Cbk,Cr-Crk)*255;
      if (d<probe){Ysum+=Y;cnt++;}
    }
    bgLumaRef = (cnt>100 ? (Ysum/cnt) : Yk);

    // パラメータ
    const low = +thrLow.value;
    const high = Math.max(+thrHigh.value, low+1);
    const soft = +edgeSoft.value;
    const shSens = +shadowSens.value/255;
    const shMax  = +shadowMax.value/100;
    const shGam  = +shadowGamma.value/100;
    const grayShadow = shadowGray.checked;

    const desp = +despill.value/100;
    const angleRad = (+angleDeg.value) * Math.PI/180;
    const COS_TH = Math.cos(angleRad);
    const DIST_MAX = +distMax.value;
    const FG_LOW = +fgLow.value/100;
    const FG_HIGH = +fgHigh.value/100;
    const EDGE_BIAS = +edgeBias.value/100;
    const keepLuma = preserveLuma.checked;

    // キー方向の単位ベクトル
    const klen = Math.hypot(Cbk,Crk)+1e-6;
    const kx = Cbk/klen, ky = Crk/klen;

    // 1st pass: 前景度
    const matte = new Float32Array(W*H);
    for (let i=0,p=0;i<data.length;i+=4,p++){
      const r=data[i]/255, g=data[i+1]/255, b=data[i+2]/255;
      const [Y,Cb,Cr]=rgbToYCbCr(r,g,b);
      const d = Math.hypot(Cb-Cbk, Cr-Crk)*255;
      matte[p] = smoothstep(low, high, d);
    }

    // 2nd pass
    matteCache = new Uint8ClampedArray(W*H);
    for (let i=0,p=0;i<data.length;i+=4,p++){
      let r=data[i]/255, g=data[i+1]/255, b=data[i+2]/255;
      const [Y,Cb,Cr]=rgbToYCbCr(r,g,b);
      const d = Math.hypot(Cb-Cbk, Cr-Crk)*255;

      // 前景度（表示ソフト）
      let f = matte[p];
      if (soft>0 && f>0 && f<1){ f = Math.pow(f, 1/(1+soft)); }

      // 影アルファ
      let shadowA = 0;
      if (f < 0.999){
        const diff = Math.max(0, bgLumaRef - Y);
        shadowA = Math.min(shMax, Math.pow(diff / Math.max(1e-6, shSens), 1/shGam));
      }
      const alpha = Math.max(0, Math.min(1, f + (1 - f) * shadowA));
      matteCache[p] = Math.round(alpha*255);

      // 適応デスピル
      if (desp>0){
        const clen = Math.hypot(Cb,Cr)+1e-6;
        const cx = Cb/clen, cy = Cr/clen;
        const cosSim = (cx*kx + cy*ky);
        const angleMask = Math.max(0, (cosSim - COS_TH) / (1 - COS_TH));
        const distMask  = Math.max(0, 1 - (d / DIST_MAX));
        const edgeM = Math.min(1, (matte[p]*(1-matte[p]))*4);
        const fgMaskBase = Math.max(0, Math.min(1, (matte[p]-FG_LOW)/Math.max(1e-6,(FG_HIGH-FG_LOW))));
        const fgMask = Math.min(1, Math.max(0, (1-EDGE_BIAS)*fgMaskBase + EDGE_BIAS*Math.max(fgMaskBase, edgeM)));
        const spillMask = angleMask * distMask * fgMask;

        if (spillMask>0){
          const k = desp * spillMask;
          const dot = (Cb*kx + Cr*ky);
          const v_par_x = dot * kx, v_par_y = dot * ky;
          const v_ort_x = Cb - v_par_x, v_ort_y = Cr - v_par_y;
          const shrink = 1 - k;
          let Cb2 = v_par_x * shrink + v_ort_x;
          let Cr2 = v_par_y * shrink + v_ort_y;
          let [r2,g2,b2] = ycbcrToRgb(Y, Cb2, Cr2);
          if (keepLuma){
            const [Yr,Cbr,Crr] = rgbToYCbCr(r2,g2,b2);
            const dY = Y - Yr;
            const [rr,gg,bb] = ycbcrToRgb(Yr+dY, Cbr, Crr);
            r2 = rr; g2 = gg; b2 = bb;
          }
          r = r2; g = g2; b = b2;
        }
      }

      // 背景側はグレースケール出力（任意）
      if (grayShadow && f < 1){
        const gray = Y;
        r = f*r + (1-f)*gray;
        g = f*g + (1-f)*gray;
        b = f*b + (1-f)*gray;
      }

      out.data[i]   = Math.round(Math.min(1, Math.max(0, r))*255);
      out.data[i+1] = Math.round(Math.min(1, Math.max(0, g))*255);
      out.data[i+2] = Math.round(Math.min(1, Math.max(0, b))*255);
      out.data[i+3] = Math.round(alpha*255);
    }

    // 背景プレビュー色
    ctxOut.save();
    ctxOut.globalCompositeOperation = 'source-over';
    ctxOut.fillStyle = bgPreview.value;
    ctxOut.fillRect(0,0,canvasOut.width,canvasOut.height);
    ctxOut.putImageData(out, 0, 0);
    ctxOut.restore();
  }

  // ===== 画像ロード
  function setBitmap(img){
    imgBitmap = img; imgW = img.width; imgH = img.height;
    canvasSrc.width = imgW; canvasSrc.height = imgH;
    ctxSrc.clearRect(0,0,imgW,imgH);
    ctxSrc.drawImage(imgBitmap,0,0);
    srcBuffer = ctxSrc.getImageData(0,0,imgW,imgH);
    canvasOut.width = imgW; canvasOut.height = imgH;
    exportBtn.disabled = false;
    scheduleRender();
  }
  function loadFile(file){
    if(!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async ()=>{ const bmp = await createImageBitmap(img); setBitmap(bmp); URL.revokeObjectURL(url); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); alert('画像の読み込みに失敗しました'); };
    img.src = url;
  }

  // ===== 入力関連
  fileInput.addEventListener('change', e=> loadFile(e.target.files?.[0]));
  ['dragenter','dragover'].forEach(ev=> drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=> drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('drag'); const f=e.dataTransfer.files?.[0]; loadFile(f); });

  // スポイト（OS）
  pipetteBtn.addEventListener('click', async ()=>{
    if (!window.EyeDropper){ alert('ブラウザがEyeDropper未対応です。上の「処理前」画像をクリックして色を取得してください。'); return; }
    try{ const ed = new EyeDropper(); const res = await ed.open(); keyPicker.value=res.sRGBHex; keyHex.value=res.sRGBHex; keySw.style.background=res.sRGBHex; scheduleRender(); }catch(e){}
  });

  // 処理前キャンバスをクリックで色取得
  canvasSrc.addEventListener('click', (e)=>{
    if (!srcBuffer) return;
    const rect = canvasSrc.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (canvasSrc.width / rect.width);
    const sy = (e.clientY - rect.top) * (canvasSrc.height / rect.height);
    const x = Math.max(0, Math.min(canvasSrc.width-1, Math.round(sx)));
    const y = Math.max(0, Math.min(canvasSrc.height-1, Math.round(sy)));
    const i = (y*canvasSrc.width + x)*4;
    const r = srcBuffer.data[i], g = srcBuffer.data[i+1], b = srcBuffer.data[i+2];
    const hex = rgbToHex([r,g,b]);
    keyPicker.value = hex; keyHex.value = hex; keySw.style.background = hex;
    scheduleRender();
  });

  // プリセット
  document.querySelectorAll('button[data-preset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const hx = btn.getAttribute('data-preset');
      keyPicker.value = hx; keyHex.value = hx; keySw.style.background = hx;
      scheduleRender();
    });
  });

  // コントロール変更
  [
    keyPicker,keyHex,thrLow,thrHigh,edgeSoft,
    shadowSens,shadowMax,shadowGamma,shadowGray,
    despill,angleDeg,distMax,fgLow,fgHigh,edgeBias,preserveLuma,
    bgPreview,scale
  ].forEach(el=>{
    el.addEventListener('input', ()=>{
      if (el===keyHex){
        const v = keyHex.value.trim();
        if(/^#?[0-9a-fA-F]{6}$/.test(v)){ const hx = v.startsWith('#')? v : '#'+v; keyPicker.value=hx; keySw.style.background=hx; }
      }
      updateLabels();
      scheduleRender();
    });
  });

  // 書き出し（合成PNG）
  exportBtn.addEventListener('click', ()=>{
    if (!imgBitmap) return;
    scheduleRender();
    const s = Math.max(1, Math.min(100, parseInt(scale.value||'100',10)));
    if (s===100){
      canvasOut.toBlob(b=>{
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'green2alpha.png';
        a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
    }else{
      const w = Math.round(canvasOut.width * s/100), h = Math.round(canvasOut.height * s/100);
      const down = document.createElement('canvas'); down.width=w; down.height=h;
      const dctx = down.getContext('2d'); dctx.imageSmoothingEnabled=true; dctx.imageSmoothingQuality='high';
      dctx.drawImage(canvasOut,0,0,w,h);
      down.toBlob(b=>{
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = `green2alpha_${s}pct.png`;
        a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
    }
  });

  // 書き出し（マットのみ）
  exportMatteBtn.addEventListener('click', ()=>{
    if (!imgBitmap || !matteCache) return;
    const W = canvasOut.width, H = canvasOut.height;
    const c = document.createElement('canvas'); c.width=W; c.height=H;
    const g = c.getContext('2d');
    const img = g.createImageData(W,H);
    for (let i=0,p=0;i<img.data.length;i+=4,p++){
      const a = matteCache[p];
      img.data[i]=a; img.data[i+1]=a; img.data[i+2]=a; img.data[i+3]=255;
    }
    g.putImageData(img,0,0);
    c.toBlob(b=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'alpha_matte.png';
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  });

  // デモ画像
  demoBtn.addEventListener('click', ()=>{
    const w=980,h=560,r=140;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const t=c.getContext('2d');
    const g=t.createLinearGradient(0,0,w,0);
    g.addColorStop(0,'#02f202'); g.addColorStop(1,'#00dd00');
    t.fillStyle=g; t.fillRect(0,0,w,h);
    t.fillStyle='rgba(0,0,0,0.35)'; t.filter='blur(14px)';
    t.beginPath(); t.ellipse(w*0.54,h*0.78,210,52,0,0,Math.PI*2); t.fill(); t.filter='none';
    t.save(); t.translate(w*0.44,h*0.46); t.rotate(-0.18);
    const grad=t.createLinearGradient(-r,-r,r,r);
    grad.addColorStop(0,'#e6e6e6'); grad.addColorStop(1,'#9a9a9a');
    t.fillStyle=grad; t.strokeStyle='#666'; t.lineWidth=6;
    t.beginPath(); t.ellipse(0,0,r*1.15,r,0,0,Math.PI*2); t.fill(); t.stroke();
    t.fillStyle='#1ca34a'; t.fillRect(-r*1.1, r*0.3, r*2.1, 18);
    t.fillStyle='#c83a3a'; t.fillRect(-r*1.1, r*0.55, r*2.1, 18);
    t.restore();
    c.toBlob(b=>{ const f=new File([b],'demo.png',{type:'image/png'}); loadFile(f); });
  });

  // 初期化
  updateLabels();
})();
</script>
</body>
</html>
